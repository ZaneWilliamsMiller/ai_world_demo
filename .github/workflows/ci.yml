name: ci

on:
  push:
    branches: [develop, main, qclaw]
  pull_request:
    branches: [develop, main, qclaw]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Compile check
        run: python -m compileall -q backend tools start.py
      - name: Import smoke
        run: python -c "from backend.app import app; assert app.title"
      - name: Ruff lint
        run: ruff check backend tests tools start.py
      - name: Pyright
        run: pyright backend tests tools start.py
      - name: Tests
        run: python -m pytest tests/ -v --tb=short

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: ESLint
        run: npm run lint

  arch-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Frontend architecture check
        run: python tools/check_arch.py
