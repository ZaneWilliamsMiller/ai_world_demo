<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>活纸江湖 · 测试中心</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #1a1a2e;
      color: #eaeaea;
      line-height: 1.6;
    }
    
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
    }
    
    header {
      text-align: center;
      margin-bottom: 30px;
      padding: 20px;
      background: linear-gradient(135deg, #16213e 0%, #0f3460 100%);
      border-radius: 12px;
      border: 1px solid #e94560;
    }
    
    header h1 {
      font-size: 2em;
      margin-bottom: 8px;
      color: #e94560;
    }
    
    header p {
      color: #a0a0b0;
    }
    
    .stats-bar {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
      margin-bottom: 25px;
    }
    
    .stat-card {
      background: #16213e;
      padding: 20px;
      border-radius: 8px;
      border: 1px solid #0f3460;
      text-align: center;
    }
    
    .stat-card h3 {
      font-size: 2em;
      color: #e94560;
      margin-bottom: 5px;
    }
    
    .stat-card p {
      color: #a0a0b0;
      font-size: 0.9em;
    }
    
    .test-grid {
      display: grid;
      gap: 15px;
    }
    
    .test-card {
      background: #16213e;
      border-radius: 8px;
      border: 1px solid #0f3460;
      padding: 20px;
      transition: all 0.3s ease;
    }
    
    .test-card:hover {
      border-color: #e94560;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(233, 69, 96, 0.2);
    }
    
    .test-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    
    .test-name {
      font-size: 1.2em;
      font-weight: 600;
      color: #fff;
    }
    
    .test-desc {
      color: #a0a0b0;
      font-size: 0.95em;
      margin-bottom: 15px;
    }
    
    .btn {
      padding: 10px 24px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 1em;
      font-weight: 500;
      transition: all 0.2s ease;
    }
    
    .btn-primary {
      background: #e94560;
      color: white;
    }
    
    .btn-primary:hover:not(:disabled) {
      background: #ff6b81;
      transform: scale(1.02);
    }
    
    .btn-primary:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    
    .btn-secondary {
      background: transparent;
      color: #e94560;
      border: 1px solid #e94560;
    }
    
    .btn-secondary:hover {
      background: rgba(233, 69, 96, 0.1);
    }
    
    .output-section {
      margin-top: 15px;
      display: none;
    }
    
    .output-section.show {
      display: block;
    }
    
    .output-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    
    .output-label {
      font-weight: 600;
      color: #fff;
    }
    
    .status-badge {
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 0.85em;
      font-weight: 600;
    }
    
    .status-success {
      background: rgba(46, 213, 115, 0.2);
      color: #2ed573;
    }
    
    .status-error {
      background: rgba(255, 71, 87, 0.2);
      color: #ff4757;
    }
    
    .status-running {
      background: rgba(255, 165, 2, 0.2);
      color:#ffa502;
    }
    
    pre.output-box {
      background: #0f0f1e;
      border: 1px solid #0f3460;
      border-radius: 6px;
      padding: 15px;
      overflow-x: auto;
      max-height: 400px;
      overflow-y: auto;
      font-family: "Consolas", "Monaco", monospace;
      font-size: 0.9em;
      line-height: 1.5;
      white-space: pre-wrap;
      word-wrap: break-word;
    }
    
    .loading-spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      border-top-color: #fff;
      animation: spin 0.8s linear infinite;
      margin-right: 6px;
      vertical-align: middle;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    
    .actions-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    
    .back-link {
      display: inline-block;
      margin-top: 20px;
      color: #e94560;
      text-decoration: none;
      font-weight: 500;
    }
    
    .back-link:hover {
      text-decoration: underline;
    }
    
    @media (max-width: 768px) {
      .container { padding: 15px; }
      header h1 { font-size: 1.5em; }
      .test-header { flex-direction: column; align-items: flex-start; gap: 10px; }
      .actions-row { width: 100%; }
      .btn { width: 100%; }
    }
  </style>
</head>
<body>
<div class="container">
  
  <header>
    <h1>🧪 测试中心</h1>
    <p>运行和管理后端测试脚本 · 活纸江湖诊断工具集</p>
  </header>

  <div class="stats-bar" id="statsBar">
    <div class="stat-card">
      <h3 id="totalTests">--</h3>
      <p>可用测试</p>
    </div>
    <div class="stat-card">
      <h3 id="runningCount">0</h3>
      <p>正在运行</p>
    </div>
    <div class="stat-card">
      <h3 id="successCount">0</h3>
      <p>成功</p>
    </div>
    <div class="stat-card">
      <h3 id="errorCount">0</h3>
      <p>失败</p>
    </div>
  </div>

  <div class="test-grid" id="testGrid"></div>

  <a href="/" class="back-link">← 返回游戏主页</a>

</div>

<script>
function escapeHtml(text) {
  if (!text) return '';
  var div = document.createElement('div');
  div.textContent = String(text);
  return div.innerHTML;
}

const API_BASE = (function() {
  try {
    const cfg = JSON.parse(localStorage.getItem('lp_config') || '{}');
    return cfg.backendUrl || (window.location.port === '8765' ? window.location.origin : 'http://localhost:8765');
  } catch(e) { return 'http://localhost:8765'; }
})();
let stats = { total: 0, running: 0, success: 0, error: 0 };

async function loadTests() {
  try {
    const resp = await fetch(`${API_BASE}/api/tests/list`);
    const data = await resp.json();
    
    document.getElementById('totalTests').textContent = data.count;
    stats.total = data.count;
    
    const grid = document.getElementById('testGrid');
    grid.innerHTML = '';
    
    data.tests.forEach(test => {
      const card = createTestCard(test);
      grid.appendChild(card);
    });
    
  } catch (err) {
    console.error('Failed to load tests:', err);
    document.getElementById('testGrid').innerHTML = `
      <div style="text-align:center;padding:40px;color:#ff4757;">
        ❌ 无法连接到后端服务<br>
        <small style="color:#a0a0b0;">请确保后端已在运行 (python start.py)</small>
      </div>
    `;
  }
}

function createTestCard(test) {
  const card = document.createElement('div');
  card.className = 'test-card';
  card.id = `card-${test.name}`;
  
  card.innerHTML = `
    <div class="test-header">
      <div>
        <div class="test-name">📋 ${escapeHtml(test.name)}</div>
        <div class="test-desc">${escapeHtml(test.description)}</div>
      </div>
    </div>
    <div class="actions-row">
      <button class="btn btn-primary" onclick="runTest('${escapeHtml(test.name)}', this)" id="btn-${escapeHtml(test.name)}">
        ▶ 运行测试
      </button>
      <button class="btn btn-secondary" onclick="toggleOutput('${escapeHtml(test.name)}')">
        📄 显示/隐藏输出
      </button>
    </div>
    <div class="output-section" id="output-${escapeHtml(test.name)}">
      <div class="output-header">
        <span class="output-label">测试输出：</span>
        <span class="status-badge" id="status-${escapeHtml(test.name)}"></span>
      </div>
      <pre class="output-box" id="result-${escapeHtml(test.name)}">等待执行...</pre>
    </div>
  `;
  
  return card;
}

async function runTest(testName, btn) {
  btn.disabled = true;
  btn.innerHTML = '<span class="loading-spinner"></span>运行中...';
  
  const outputSection = document.getElementById(`output-${testName}`);
  const resultBox = document.getElementById(`result-${testName}`);
  const statusBadge = document.getElementById(`status-${testName}`);
  
  outputSection.classList.add('show');
  statusBadge.className = 'status-badge status-running';
  statusBadge.textContent = '⏳ 运行中...';
  resultBox.textContent = '正在执行测试，请稍候...';
  
  stats.running++;
  updateStats();
  
  try {
    const startTime = Date.now();
    const resp = await fetch(`${API_BASE}/api/tests/run/${testName}`, { method: 'POST' });
    const data = await resp.json();
    const elapsed = ((Date.now() - startTime) / 1000).toFixed(1);
    
    if (data.success) {
      statusBadge.className = 'status-badge status-success';
      statusBadge.textContent = `✅ 成功 (${elapsed}s)`;
      stats.success++;
    } else {
      statusBadge.className = 'status-badge status-error';
      statusBadge.textContent = `❌ 失败 (${elapsed}s) [退出码: ${data.exit_code}]`;
      stats.error++;
    }
    
    resultBox.textContent = `[${testName}] 执行耗时: ${elapsed}s\n\n${data.output}`;
    
  } catch (err) {
    statusBadge.className = 'status-badge status-error';
    statusBadge.textContent = '❌ 错误';
    resultBox.textContent = `请求失败: ${err.message}`;
    stats.error++;
  }
  
  stats.running--;
  updateStats();
  
  btn.disabled = false;
  btn.innerHTML = '▶ 重新运行';
}

function toggleOutput(testName) {
  const section = document.getElementById(`output-${testName}`);
  section.classList.toggle('show');
}

function updateStats() {
  document.getElementById('runningCount').textContent = stats.running;
  document.getElementById('successCount').textContent = stats.success;
  document.getElementById('errorCount').textContent = stats.error;
}

document.addEventListener('DOMContentLoaded', loadTests);
</script>

</body>
</html>
