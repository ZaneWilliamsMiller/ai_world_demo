<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>江湖行纪 · 运维面板</title>
<style>
:root {
  --bg-dark: #0d0d1a;
  --bg-card: #1a1a2e;
  --border-gold: #d4a056;
  --accent-blue: #60a5fa;
  --accent-red: #ef4444;
  --accent-green: #22c55e;
  --accent-yellow: #eab308;
  --text-main: #f8f8ff;
  --text-muted: #a0a0c8;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
  background: var(--bg-dark);
  color: var(--text-main);
  min-height: 100vh;
}
.header {
  background: linear-gradient(135deg, #0f0f1e, #1a1a2e);
  border-bottom: 1px solid var(--border-gold);
  padding: 16px 24px;
  font-size: 20px;
  font-weight: bold;
  color: var(--border-gold);
  letter-spacing: 2px;
}
.grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
  padding: 16px 24px;
}
.card {
  background: var(--bg-card);
  border: 1px solid rgba(212, 160, 86, 0.3);
  border-radius: 8px;
  padding: 16px;
}
.card h2 {
  font-size: 14px;
  color: var(--border-gold);
  margin-bottom: 12px;
  border-bottom: 1px solid rgba(212, 160, 86, 0.15);
  padding-bottom: 8px;
}
.stat-row {
  display: flex;
  justify-content: space-between;
  padding: 4px 0;
  font-size: 13px;
}
.stat-label { color: var(--text-muted); }
.stat-value { color: var(--text-main); font-weight: 500; }
.stat-value.good { color: var(--accent-green); }
.stat-value.bad { color: var(--accent-red); }
.stat-value.warn { color: var(--accent-yellow); }
.table-wrap {
  padding: 0 24px 24px;
}
.table-wrap h2 {
  font-size: 14px;
  color: var(--border-gold);
  margin-bottom: 8px;
}
table {
  width: 100%;
  border-collapse: collapse;
  font-size: 12px;
}
th {
  background: rgba(212, 160, 86, 0.1);
  color: var(--border-gold);
  text-align: left;
  padding: 8px 6px;
  border-bottom: 1px solid rgba(212, 160, 86, 0.2);
  white-space: nowrap;
}
td {
  padding: 6px;
  border-bottom: 1px solid rgba(160, 160, 192, 0.08);
  color: var(--text-muted);
  max-width: 180px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
tr:nth-child(even) td { background: rgba(26, 26, 46, 0.5); }
.tag {
  display: inline-block;
  padding: 1px 6px;
  border-radius: 3px;
  font-size: 11px;
}
.tag-success { background: rgba(34, 197, 94, 0.15); color: var(--accent-green); }
.tag-failed { background: rgba(239, 68, 68, 0.15); color: var(--accent-red); }
.tag-timeout { background: rgba(234, 179, 8, 0.15); color: var(--accent-yellow); }
.npc-list { max-height: 240px; overflow-y: auto; }
.player-item, .npc-item {
  padding: 6px 0;
  border-bottom: 1px solid rgba(160, 160, 192, 0.06);
  font-size: 12px;
}
.player-item span, .npc-item span { margin-right: 8px; }
.error-banner {
  background: rgba(239, 68, 68, 0.15);
  color: var(--accent-red);
  padding: 8px 24px;
  font-size: 13px;
  display: none;
}
</style>
</head>
<body>
<div class="header">江湖行纪 · 运维面板</div>
<div class="error-banner" id="errorBanner"></div>
<div class="grid">
  <div class="card">
    <h2>LLM 调用统计</h2>
    <div id="metricsContent"><span style="color:var(--text-muted)">加载中...</span></div>
  </div>
  <div class="card">
    <h2>熔断器状态</h2>
    <div id="cbContent"><span style="color:var(--text-muted)">加载中...</span></div>
  </div>
  <div class="card">
    <h2>活跃玩家</h2>
    <div id="playersContent" style="max-height:240px;overflow-y:auto"><span style="color:var(--text-muted)">加载中...</span></div>
  </div>
  <div class="card">
    <h2>NPC 状态</h2>
    <div id="npcContent" class="npc-list"><span style="color:var(--text-muted)">加载中...</span></div>
  </div>
</div>
<div class="table-wrap">
  <h2>最近 20 条 LLM 调用记录</h2>
  <table>
    <thead>
      <tr>
        <th>时间</th>
        <th>操作</th>
        <th>模型</th>
        <th>延迟(ms)</th>
        <th>Token入</th>
        <th>Token出</th>
        <th>状态</th>
        <th>错误</th>
      </tr>
    </thead>
    <tbody id="callsBody"></tbody>
  </table>
</div>
<script>
let adminSecret = '';
let _promptingSecret = false;

function escapeHtml(str) {
  if (str == null) return '';
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function promptSecret() {
  if (_promptingSecret) return;
  _promptingSecret = true;
  adminSecret = prompt('请输入 Admin Secret:');
  if (!adminSecret) {
    document.getElementById('errorBanner').textContent = '未提供 Admin Secret，无法访问数据';
    document.getElementById('errorBanner').style.display = 'block';
  } else {
    document.getElementById('errorBanner').style.display = 'none';
    fetchAll();
  }
  _promptingSecret = false;
}

async function apiFetch(url) {
  const resp = await fetch(url, { headers: { 'X-Admin-Secret': adminSecret } });
  if (resp.status === 403) {
    if (!_promptingSecret) promptSecret();
    return null;
  }
  if (!resp.ok) return null;
  return resp.json();
}

function fmtTime(ts) {
  if (!ts) return '-';
  const d = new Date(ts * 1000);
  return d.toLocaleTimeString('zh-CN', { hour12: false });
}

function statusTag(s) {
  const cls = s === 'success' ? 'tag-success' : s === 'timeout' ? 'tag-timeout' : 'tag-failed';
  return `<span class="tag ${cls}">${escapeHtml(s)}</span>`;
}

async function fetchMetrics() {
  const data = await apiFetch('/api/admin/metrics');
  if (!data) return;
  const rateClass = data.success_rate >= 0.95 ? 'good' : data.success_rate >= 0.8 ? 'warn' : 'bad';
  document.getElementById('metricsContent').innerHTML = `
    <div class="stat-row"><span class="stat-label">总调用数</span><span class="stat-value">${escapeHtml(data.total_calls)}</span></div>
    <div class="stat-row"><span class="stat-label">成功率</span><span class="stat-value ${rateClass}">${(data.success_rate * 100).toFixed(1)}%</span></div>
    <div class="stat-row"><span class="stat-label">P50 延迟</span><span class="stat-value">${escapeHtml(data.p50_latency_ms)}ms</span></div>
    <div class="stat-row"><span class="stat-label">P95 延迟</span><span class="stat-value">${escapeHtml(data.p95_latency_ms)}ms</span></div>
    <div class="stat-row"><span class="stat-label">平均延迟</span><span class="stat-value">${escapeHtml(data.avg_latency_ms)}ms</span></div>
    <div class="stat-row"><span class="stat-label">Token 入</span><span class="stat-value">${escapeHtml(data.total_tokens_in)}</span></div>
    <div class="stat-row"><span class="stat-label">Token 出</span><span class="stat-value">${escapeHtml(data.total_tokens_out)}</span></div>
  `;
}

async function fetchCB() {
  const data = await apiFetch('/api/admin/circuit_breaker');
  if (!data) return;
  const stateClass = data.state === 'closed' ? 'good' : data.state === 'open' ? 'bad' : 'warn';
  const stateLabel = { closed: '正常', open: '熔断', half_open: '半开', disabled: '禁用' }[data.state] || data.state;
  document.getElementById('cbContent').innerHTML = `
    <div class="stat-row"><span class="stat-label">当前状态</span><span class="stat-value ${stateClass}">${escapeHtml(stateLabel)}</span></div>
    <div class="stat-row"><span class="stat-label">总请求数</span><span class="stat-value">${escapeHtml(data.total_requests)}</span></div>
    <div class="stat-row"><span class="stat-label">失败数</span><span class="stat-value">${escapeHtml(data.total_failures)}</span></div>
    <div class="stat-row"><span class="stat-label">拒绝数</span><span class="stat-value">${escapeHtml(data.rejected)}</span></div>
    <div class="stat-row"><span class="stat-label">近期失败</span><span class="stat-value">${escapeHtml(data.recent_failures)}</span></div>
  `;
}

async function fetchPlayers() {
  const data = await apiFetch('/api/admin/players');
  if (!data) return;
  const el = document.getElementById('playersContent');
  if (!data.players || data.players.length === 0) {
    el.innerHTML = '<span style="color:var(--text-muted)">暂无活跃玩家</span>';
    return;
  }
  el.innerHTML = data.players.map(p => `
    <div class="player-item">
      <span style="color:var(--accent-blue)">${escapeHtml(p.player_id.slice(0,8))}</span>
      <span>${escapeHtml(p.display_name)}</span>
      <span style="color:var(--text-muted)">${escapeHtml(p.map_id)} (${escapeHtml(p.px)},${escapeHtml(p.py)})</span>
      ${p.dead ? '<span class="tag tag-failed">已故</span>' : ''}
      ${p.ended ? '<span class="tag tag-timeout">已结束</span>' : ''}
    </div>
  `).join('');
}

async function fetchNPC() {
  const data = await apiFetch('/api/admin/npc_states');
  if (!data) return;
  const el = document.getElementById('npcContent');
  const keys = Object.keys(data);
  if (keys.length === 0) {
    el.innerHTML = '<span style="color:var(--text-muted)">暂无 NPC 数据</span>';
    return;
  }
  let html = '';
  for (const pid of keys) {
    const npcs = data[pid];
    html += `<div style="color:var(--accent-blue);font-size:12px;margin-top:6px">玩家 ${escapeHtml(pid.slice(0,8))}</div>`;
    for (const [nid, info] of Object.entries(npcs)) {
      const posStr = Array.isArray(info.pos) ? info.pos.join(',') : info.pos;
      html += `<div class="npc-item">
        <span style="color:var(--border-gold)">${escapeHtml(nid)}</span>
        <span style="color:var(--text-muted)">${escapeHtml(posStr)}</span>
        <span class="tag ${info.state === 'idle' ? 'tag-success' : info.state === 'hostile' ? 'tag-failed' : 'tag-timeout'}">${escapeHtml(info.state)}</span>
        ${info.plan_summary ? `<span style="color:var(--text-muted);font-size:11px">${escapeHtml(info.plan_summary)}</span>` : ''}
      </div>`;
    }
  }
  el.innerHTML = html;
}

async function fetchCalls() {
  const data = await apiFetch('/api/admin/recent_calls?n=20');
  if (!data || !data.calls) return;
  const tbody = document.getElementById('callsBody');
  if (!data.calls.length) {
    tbody.innerHTML = '<tr><td colspan="8" style="text-align:center;color:var(--text-muted)">暂无记录</td></tr>';
    return;
  }
  tbody.innerHTML = data.calls.reverse().map(c => `
    <tr>
      <td>${escapeHtml(fmtTime(c.timestamp))}</td>
      <td>${escapeHtml(c.operation)}</td>
      <td>${escapeHtml(c.model || '-')}</td>
      <td>${escapeHtml(c.latency_ms || '-')}</td>
      <td>${escapeHtml(c.tokens_in || 0)}</td>
      <td>${escapeHtml(c.tokens_out || 0)}</td>
      <td>${statusTag(c.status)}</td>
      <td title="${escapeHtml(c.error_msg || '')}">${escapeHtml(c.error_msg || '-')}</td>
    </tr>
  `).join('');
}

async function fetchAll() {
  if (!adminSecret) return;
  try {
    await Promise.all([fetchMetrics(), fetchCB(), fetchPlayers(), fetchNPC(), fetchCalls()]);
  } catch (e) {
    console.error('fetchAll error:', e);
  }
}

promptSecret();
setInterval(fetchAll, 5000);
</script>
</body>
</html>
