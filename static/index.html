<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>活纸 · 江湖行纪</title>
<style>
:root {
  --bg-dark: #1a1a2e;
  --bg-panel: #16213e;
  --bg-card: #1e2a4a;
  --border: #2a3a5a;
  --text: #e0e0e0;
  --text-dim: #8888aa;
  --accent: #4fc3f7;
  --accent2: #ff7043;
  --green: #66bb6a;
  --yellow: #fdd835;
  --red: #ef5350;
  --gold: #ffd700;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
  background: var(--bg-dark);
  color: var(--text);
  height: 100vh;
  overflow: hidden;
}
#app { display: flex; flex-direction: column; height: 100vh; }

/* ── 顶栏 ── */
.topbar {
  background: var(--bg-panel);
  border-bottom: 1px solid var(--border);
  padding: 8px 16px;
  display: flex;
  align-items: center;
  gap: 16px;
  flex-shrink: 0;
}
.topbar h1 { font-size: 18px; color: var(--accent); letter-spacing: 2px; }
.topbar .subtitle { font-size: 12px; color: var(--text-dim); }
.topbar .spacer { flex: 1; }
.topbar button {
  background: var(--bg-card);
  color: var(--text);
  border: 1px solid var(--border);
  padding: 6px 14px;
  border-radius: 4px;
  cursor: pointer;
  font-size: 13px;
}
.topbar button:hover { border-color: var(--accent); }
.topbar button.primary { background: var(--accent); color: #111; font-weight: bold; }

/* ── 主体三栏 ── */
.main { display: flex; flex: 1; overflow: hidden; }

/* ── 左栏：地图 ── */
.left-panel {
  width: 340px;
  flex-shrink: 0;
  background: var(--bg-panel);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.panel-title {
  padding: 8px 12px;
  font-size: 13px;
  color: var(--accent);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.map-container {
  flex: 1;
  overflow: auto;
  padding: 8px;
}
.map-grid {
  display: grid;
  gap: 0;
  font-family: "Courier New", monospace;
  font-size: 11px;
  line-height: 1.1;
  white-space: pre;
}
.map-cell {
  width: 16px;
  height: 16px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  cursor: pointer;
  border-radius: 2px;
  transition: background 0.15s;
}
.map-cell:hover { background: rgba(79,195,247,0.2); }
.map-cell.player { background: var(--accent); color: #111; font-weight: bold; border-radius: 3px; }
.map-cell.npc { background: var(--accent2); color: #fff; border-radius: 3px; }
.map-cell.portal { animation: pulse 1.5s infinite; }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.5; } }

.legend {
  padding: 8px 12px;
  border-top: 1px solid var(--border);
  font-size: 11px;
  color: var(--text-dim);
  flex-shrink: 0;
}
.legend span { margin-right: 10px; }

/* ── 中栏：对话 ── */
.center-panel {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  min-width: 0;
}
.dialogue-area {
  flex: 1;
  overflow-y: auto;
  padding: 12px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.msg {
  max-width: 80%;
  padding: 8px 12px;
  border-radius: 8px;
  line-height: 1.6;
  font-size: 14px;
}
.msg.npc {
  align-self: flex-start;
  background: var(--bg-card);
  border: 1px solid var(--border);
}
.msg.npc .speaker {
  font-size: 12px;
  color: var(--accent2);
  margin-bottom: 4px;
}
.msg.player {
  align-self: flex-end;
  background: var(--accent);
  color: #111;
}
.msg.system {
  align-self: center;
  background: transparent;
  color: var(--text-dim);
  font-size: 12px;
  font-style: italic;
}
.input-bar {
  padding: 8px 12px;
  border-top: 1px solid var(--border);
  display: flex;
  gap: 8px;
  flex-shrink: 0;
}
.input-bar select {
  background: var(--bg-card);
  color: var(--text);
  border: 1px solid var(--border);
  padding: 6px 8px;
  border-radius: 4px;
  font-size: 13px;
}
.input-bar input {
  flex: 1;
  background: var(--bg-card);
  color: var(--text);
  border: 1px solid var(--border);
  padding: 6px 12px;
  border-radius: 4px;
  font-size: 14px;
}
.input-bar input:focus { outline: none; border-color: var(--accent); }
.input-bar button {
  background: var(--accent);
  color: #111;
  border: none;
  padding: 6px 16px;
  border-radius: 4px;
  cursor: pointer;
  font-weight: bold;
}
.input-bar button:disabled { opacity: 0.5; cursor: not-allowed; }

/* ── 右栏：状态 ── */
.right-panel {
  width: 260px;
  flex-shrink: 0;
  background: var(--bg-panel);
  border-left: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  overflow-y: auto;
}
.stat-block {
  padding: 10px 12px;
  border-bottom: 1px solid var(--border);
}
.stat-block h3 {
  font-size: 12px;
  color: var(--text-dim);
  margin-bottom: 6px;
  letter-spacing: 1px;
}
.stat-row {
  display: flex;
  justify-content: space-between;
  font-size: 13px;
  padding: 2px 0;
}
.bar-bg {
  width: 100%;
  height: 8px;
  background: #2a3a5a;
  border-radius: 4px;
  margin-top: 4px;
  overflow: hidden;
}
.bar-fill {
  height: 100%;
  border-radius: 4px;
  transition: width 0.3s;
}
.bar-fill.vigor { background: var(--green); }
.bar-fill.spirit { background: var(--accent); }
.bar-fill.coins { background: var(--gold); }
.npc-list { list-style: none; }
.npc-list li {
  padding: 6px 8px;
  border-radius: 4px;
  cursor: pointer;
  font-size: 13px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.npc-list li:hover { background: var(--bg-card); }
.npc-list li.selected { background: var(--bg-card); border: 1px solid var(--accent); }
.npc-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--accent2);
  flex-shrink: 0;
}
.inv-list { font-size: 12px; color: var(--text-dim); }
.inv-list span { display: inline-block; background: var(--bg-card); padding: 2px 6px; border-radius: 3px; margin: 2px; }

/* ── 登录界面 ── */
.overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.85);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 100;
}
.login-box {
  background: var(--bg-panel);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 32px;
  width: 360px;
}
.login-box h2 { text-align: center; color: var(--accent); margin-bottom: 20px; letter-spacing: 3px; }
.login-box label { display: block; font-size: 13px; color: var(--text-dim); margin-bottom: 4px; }
.login-box input, .login-box select {
  width: 100%;
  background: var(--bg-card);
  color: var(--text);
  border: 1px solid var(--border);
  padding: 8px 12px;
  border-radius: 4px;
  font-size: 14px;
  margin-bottom: 12px;
}
.login-box button {
  width: 100%;
  background: var(--accent);
  color: #111;
  border: none;
  padding: 10px;
  border-radius: 4px;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
  margin-top: 8px;
}
.saves-list { max-height: 160px; overflow-y: auto; margin-bottom: 12px; }
.saves-list div {
  padding: 6px 10px;
  border: 1px solid var(--border);
  border-radius: 4px;
  margin-bottom: 4px;
  cursor: pointer;
  font-size: 13px;
}
.saves-list div:hover { border-color: var(--accent); }
.saves-list div.selected { border-color: var(--accent); background: var(--bg-card); }

/* ── 加载动画 ── */
.loading { display: flex; align-items: center; justify-content: center; height: 100%; color: var(--text-dim); }
.streaming-cursor { animation: blink 0.8s infinite; }
@keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0; } }

/* ── 天气/时辰徽章 ── */
.badge {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 10px;
  font-size: 11px;
  margin-left: 6px;
}
.badge.night { background: #2a3a5a; color: var(--accent); }
.badge.day { background: #4a3a1a; color: var(--yellow); }
</style>
</head>
<body>
<div id="app">
  <!-- 登录界面 -->
  <div class="overlay" id="loginOverlay">
    <div class="login-box">
      <h2>🏮 江湖行纪</h2>
      <div id="loginForm">
        <label>江湖名号</label>
        <input type="text" id="inpName" placeholder="输入你的名号..." maxlength="24">
        <label>性别</label>
        <select id="inpGender">
          <option value="男">男</option>
          <option value="女">女</option>
          <option value="未言">不透露</option>
        </select>
        <label><input type="checkbox" id="inpPermadeath"> 真实江湖（永久死亡）</label>
        <button onclick="doHello()">踏入江湖</button>
      </div>
      <div id="loadForm" style="display:none;">
        <label>选择存档</label>
        <div class="saves-list" id="savesList"></div>
        <button onclick="doLoad()">继续江湖</button>
        <button onclick="showLogin()" style="background:transparent; color:var(--text-dim); margin-top:4px;">返回新建</button>
      </div>
      <div style="text-align:center;margin-top:12px;">
        <button onclick="showLoad()" style="background:transparent;color:var(--accent);">载入旧档 →</button>
      </div>
    </div>
  </div>

  <!-- 游戏主界面 -->
  <div class="topbar" id="topbar" style="display:none;">
    <h1>🏮 活纸 · 江湖行纪</h1>
    <span class="subtitle" id="topbarInfo"></span>
    <span class="spacer"></span>
    <button onclick="doSave()">💾 存档</button>
    <button onclick="doLogout()">🚪 退出</button>
  </div>

  <div class="main" id="mainUI" style="display:none;">
    <!-- 左栏：地图 -->
    <div class="left-panel">
      <div class="panel-title" id="mapTitle">🗺️ 地图</div>
      <div class="map-container" id="mapContainer"></div>
      <div class="legend">
        <div>图例：<span style="color:#4fc3f7;">■</span>你 <span style="color:#ff7043;">■</span>NPC <span style="color:#ffd700;">↗</span>界门</div>
      </div>
    </div>

    <!-- 中栏：对话 -->
    <div class="center-panel">
      <div class="dialogue-area" id="dialogueArea">
        <div class="msg system" id="introMsg"></div>
      </div>
      <div class="input-bar">
        <select id="npcSelect"></select>
        <input type="text" id="msgInput" placeholder="对 TA 说些什么..." onkeydown="if(event.key==='Enter')doTalk()">
        <button onclick="doTalk()" id="talkBtn">发送</button>
      </div>
    </div>

    <!-- 右栏：状态 -->
    <div class="right-panel">
      <div class="stat-block">
        <h3>🧭 时辰气象</h3>
        <div class="stat-row"><span id="statTime">--</span><span id="statWeather">--</span></div>
      </div>
      <div class="stat-block">
        <h3>💪 身心状态</h3>
        <div class="stat-row"><span>体力</span><span id="statVigor">--/--</span></div>
        <div class="bar-bg"><div class="bar-fill vigor" id="barVigor"></div></div>
        <div class="stat-row" style="margin-top:6px;"><span>心气</span><span id="statSpirit">--/--</span></div>
        <div class="bar-bg"><div class="bar-fill spirit" id="barSpirit"></div></div>
      </div>
      <div class="stat-block">
        <h3>💰 钱银货物</h3>
        <div class="stat-row"><span>制钱</span><span id="statCoins">--</span></div>
        <div class="inv-list" id="statInv"></div>
      </div>
      <div class="stat-block">
        <h3>🧑🤝🧑 此地图人物</h3>
        <ul class="npc-list" id="npcList"></ul>
      </div>
      <div class="stat-block">
        <h3>🏘️ 地图切换</h3>
        <div id="portalList" style="font-size:12px;color:var(--text-dim);"></div>
      </div>
    </div>
  </div>
</div>

<script>
// ═══════════════════════════════════════════════════════
//  全局状态
// ═══════════════════════════════════════════════════════
const API = "/api";
let playerId = null;
let displayName = null;
let mapsData = {};
let currentMapId = null;
let npcsHere = [];
let selectedNpcId = null;
let isStreaming = false;

// ═══════════════════════════════════════════════════════
//  登录流程
// ═══════════════════════════════════════════════════════
async function doHello() {
  const name = document.getElementById("inpName").value.trim() || "江湖客";
  const gender = document.getElementById("inpGender").value;
  const permadeath = document.getElementById("inpPermadeath").checked;
  const pid = "web_" + Date.now();
  const res = await fetch(`${API}/hello`, {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({player_id: pid, display_name: name, gender, permadeath})
  });
  const data = await res.json();
  onGameReady(data, pid);
}

async function showLoad() {
  document.getElementById("loginForm").style.display = "none";
  document.getElementById("loadForm").style.display = "block";
  const res = await fetch(`${API}/saves`);
  const data = await res.json();
  const list = document.getElementById("savesList");
  list.innerHTML = "";
  (data.saves || []).forEach(s => {
    const div = document.createElement("div");
    div.textContent = `${s.display_name}  (${s.map_id}, 第${s.world_day}日) ${s.dead ? "【亡】" : ""}`;
    div.onclick = () => { 
      document.querySelectorAll(".saves-list div").forEach(d => d.classList.remove("selected"));
      div.classList.add("selected");
      div._pid = s.player_id;
    };
    list.appendChild(div);
  });
}

function showLogin() {
  document.getElementById("loadForm").style.display = "none";
  document.getElementById("loginForm").style.display = "block";
}

async function doLoad() {
  const sel = document.querySelector(".saves-list div.selected");
  if (!sel) return alert("请先选择一个存档");
  const pid = sel._pid;
  const res = await fetch(`${API}/load`, {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({player_id: pid})
  });
  const data = await res.json();
  onGameReady(data, pid);
}

function onGameReady(data, pid) {
  playerId = pid;
  displayName = data.display_name;
  mapsData = data.maps || {};
  document.getElementById("loginOverlay").style.display = "none";
  document.getElementById("topbar").style.display = "flex";
  document.getElementById("mainUI").style.display = "flex";
  document.getElementById("introMsg").innerHTML = `<b>欢迎，${displayName}！</b><br>${data.intro || "江湖路远，珍重。"}`;
  updateUI(data);
}

function doLogout() {
  if (!confirm("确定退出？未存档的进度将丢失。")) return;
  playerId = null;
  document.getElementById("mainUI").style.display = "none";
  document.getElementById("topbar").style.display = "none";
  document.getElementById("loginOverlay").style.display = "flex";
}

// ═══════════════════════════════════════════════════════
//  UI 更新
// ═══════════════════════════════════════════════════════
function updateUI(data) {
  const p = data.player || {};
  currentMapId = p.map_id;

  // 顶栏
  const isNight = p.world_is_night;
  const badge = isNight 
    ? `<span class="badge night">${p.world_shichen}·夜</span>`
    : `<span class="badge day">${p.world_shichen}</span>`;
  document.getElementById("topbarInfo").innerHTML = 
    `${p.map_id || ''} ${badge} ${p.weather || ''}`;

  // 地图
  renderMap(p);

  // NPC 列表
  npcsHere = data.npcs_here || [];
  renderNpcList();

  // 对话 NPC 下拉
  renderNpcSelect();

  // 状态栏
  document.getElementById("statTime").textContent = `${p.world_shichen || ''}  ${p.weather || ''}`;
  document.getElementById("statWeather").textContent = `第${p.world_day || 1}日`;

  const vigor = p.vigor || 0, vigorMax = p.vigor_max || 100;
  const spirit = p.spirit || 0, spiritMax = p.spirit_max || 100;
  document.getElementById("statVigor").textContent = `${vigor}/${vigorMax}`;
  document.getElementById("barVigor").style.width = `${(vigor/vigorMax*100).toFixed(0)}%`;
  document.getElementById("statSpirit").textContent = `${spirit}/${spiritMax}`;
  document.getElementById("barSpirit").style.width = `${(spirit/spiritMax*100).toFixed(0)}%`;

  document.getElementById("statCoins").textContent = `${p.coins || 0} 文`;
  const inv = p.inventory || {};
  document.getElementById("statInv").innerHTML = Object.entries(inv).map(([k,v]) => 
    `<span>${k}×${v}</span>`).join("") || "<span style='color:#555;'>身无长物</span>";

  // 地图切换（界门）
  renderPortals(p);
}

// ═══════════════════════════════════════════════════════
//  地图渲染
// ═══════════════════════════════════════════════════════
function renderMap(p) {
  const mapInfo = mapsData[currentMapId];
  if (!mapInfo) return;
  const rows = mapInfo.rows;
  const portals = mapInfo.portals || [];
  const px = p.px, py = p.py;

  document.getElementById("mapTitle").textContent = `🗺️ ${mapInfo.name || currentMapId}`;

  const container = document.getElementById("mapContainer");
  const cols = rows[0] ? rows[0].length : 72;
  const rowsCount = rows.length;
  container.innerHTML = "";

  const grid = document.createElement("div");
  grid.className = "map-grid";
  grid.style.gridTemplateColumns = `repeat(${cols}, 16px)`;

  // 收集此地图 NPC 位置
  const npcPositions = {};
  const states = p.npc_states || {};
  Object.entries(states).forEach(([npcId, n]) => {
    if (n.map_id === currentMapId) npcPositions[npcId] = true;
  });

  for (let y = 0; y < rowsCount; y++) {
    const row = rows[y] || "";
    for (let x = 0; x < cols; x++) {
      const ch = x < row.length ? row[x] : " ";
      const cell = document.createElement("div");
      cell.className = "map-cell";
      cell.dataset.x = x;
      cell.dataset.y = y;
      cell.innerHTML = terrainChar(ch);
      if (x === px && y === py) cell.classList.add("player");
      // 检查是否有 NPC 在此格（简化处理：只标 npcs_here 中的 NPC）
      cell.title = `(${x},${y}) ${ch}`;
      cell.onclick = () => doMove(x, y);
      grid.appendChild(cell);
    }
  }
  container.appendChild(grid);
}

function terrainChar(ch) {
  const m = {"#":"⬛",".":"·","~":"〜","=":"＝","F":"🌲","m":"▲",";":"✦","/":"╱",
    "T":"🏠","Y":"📮","I":"🏚","M":"🏪","B":"⚔","C":"🏯","G":"⛩",
    "f":"🐟","w":"🚢","s":"⛵","E":"🏛","*":"💰"};
  return m[ch] || (ch === " " ? "&nbsp;" : ch);
}

// ═══════════════════════════════════════════════════════
//  移动
// ═══════════════════════════════════════════════════════
async function doMove(tx, ty) {
  if (!playerId) return;
  const res = await fetch(`${API}/move`, {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({player_id: playerId, to_x: tx, to_y: ty})
  });
  const data = await res.json();
  addMsg("system", `移动到 (${tx},${ty})`);
  updateUI(data);
}

// ═══════════════════════════════════════════════════════
//  NPC 列表
// ═══════════════════════════════════════════════════════
function renderNpcList() {
  const ul = document.getElementById("npcList");
  ul.innerHTML = "";
  npcsHere.forEach(n => {
    const li = document.createElement("li");
    li.innerHTML = `<span class="npc-dot"></span>${n.name}`;
    li.onclick = () => {
      selectedNpcId = n.id;
      renderNpcList();
      renderNpcSelect();
      document.getElementById("msgInput").focus();
    };
    if (n.id === selectedNpcId) li.classList.add("selected");
    ul.appendChild(li);
  });
}

function renderNpcSelect() {
  const sel = document.getElementById("npcSelect");
  sel.innerHTML = "";
  npcsHere.forEach(n => {
    const opt = document.createElement("option");
    opt.value = n.id;
    opt.textContent = n.name;
    if (n.id === selectedNpcId) opt.selected = true;
    sel.appendChild(opt);
  });
  sel.onchange = () => { selectedNpcId = sel.value; renderNpcList(); };
  if (!selectedNpcId && npcsHere.length > 0) selectedNpcId = npcsHere[0].id;
}

// ═══════════════════════════════════════════════════════
//  对话
// ═══════════════════════════════════════════════════════
async function doTalk() {
  if (isStreaming) return;
  const input = document.getElementById("msgInput");
  const msg = input.value.trim();
  if (!msg || !selectedNpcId || !playerId) return;
  input.value = "";
  addMsg("player", msg);

  // 使用流式接口
  isStreaming = true;
  document.getElementById("talkBtn").disabled = true;
  const npcName = npcsHere.find(n => n.id === selectedNpcId)?.name || "NPC";

  const msgDiv = addMsg("npc", "...", npcName);
  let visibleText = "";

  try {
    const res = await fetch(`${API}/npc/talk_stream`, {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({player_id: playerId, npc_id: selectedNpcId, message: msg})
    });
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buf = "";
    while (true) {
      const {done, value} = await reader.read();
      if (done) break;
      buf += decoder.decode(value, {stream: true});
      const lines = buf.split("\n");
      buf = lines.pop();
      for (const line of lines) {
        if (!line.startsWith("data: ")) continue;
        const d = JSON.parse(line.slice(6));
        if (d.chunk) {
          visibleText += d.chunk;
          msgDiv.querySelector(".msg-text").textContent = visibleText;
          scrollToBottom();
        }
        if (d.done) {
          // 更新状态
          if (d.player) {
            fetchState();
          }
          break;
        }
      }
    }
  } catch(e) {
    msgDiv.querySelector(".msg-text").textContent = "【对话中断，请重试】";
  }
  isStreaming = false;
  document.getElementById("talkBtn").disabled = false;
  scrollToBottom();
}

function addMsg(type, text, speaker) {
  const area = document.getElementById("dialogueArea");
  const div = document.createElement("div");
  div.className = "msg " + type;
  if (type === "npc" && speaker) {
    div.innerHTML = `<div class="speaker">${speaker}</div><div class="msg-text">${text}</div>`;
  } else {
    div.textContent = text;
  }
  area.appendChild(div);
  scrollToBottom();
  return div;
}

function scrollToBottom() {
  const area = document.getElementById("dialogueArea");
  area.scrollTop = area.scrollHeight;
}

// ═══════════════════════════════════════════════════════
//  状态刷新
// ═══════════════════════════════════════════════════════
async function fetchState() {
  if (!playerId) return;
  const res = await fetch(`${API}/state/${playerId}`);
  const data = await res.json();
  updateUI(data);
}

// ═══════════════════════════════════════════════════════
//  存档
// ═══════════════════════════════════════════════════════
async function doSave() {
  if (!playerId) return;
  const res = await fetch(`${API}/save`, {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({player_id: playerId})
  });
  const data = await res.json();
  addMsg("system", data.ok ? "💾 存档成功" : "❌ 存档失败");
}

// ═══════════════════════════════════════════════════════
//  界门（地图切换）
// ═══════════════════════════════════════════════════════
function renderPortals(p) {
  const mapInfo = mapsData[currentMapId];
  if (!mapInfo) return;
  const portals = mapInfo.portals || [];
  const div = document.getElementById("portalList");
  if (portals.length === 0) {
    div.innerHTML = "<span style='color:#555;'>此地图无界门</span>";
    return;
  }
  div.innerHTML = portals.map(pt => {
    const targetMap = mapsData[pt.target_map_id];
    return `<div style="cursor:pointer;padding:4px 0;" onclick="doMove(${pt.to_x},${pt.to_y})">
      ↗ 往【${targetMap ? targetMap.name : pt.target_map_id}】(${pt.to_x},${pt.to_y})
    </div>`;
  }).join("");
}

// ═══════════════════════════════════════════════════════
//  自动刷新状态（每30秒）
// ═══════════════════════════════════════════════════════
setInterval(() => { if (playerId) fetchState(); }, 30000);
</script>
