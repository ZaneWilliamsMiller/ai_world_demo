<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>活纸 · 江湖行纪</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/game.css">
</head>
<body>
<div id="app">

  <!-- ========== 登录界面 ========== -->
  <div class="overlay" id="loginOverlay">
    <div class="login-box">
      <h2>🏮 江湖行纪</h2>

      <!-- 新建角色 -->
      <div id="loginForm">
        <label for="inpName">江湖名号</label>
        <input type="text" id="inpName" placeholder="输入你的名号..." maxlength="24">
        <label for="inpGender">性别</label>
        <select id="inpGender">
          <option value="男">男</option>
          <option value="女">女</option>
          <option value="未言">不透露</option>
        </select>
        <label for="inpPermadeath">
          <input type="checkbox" id="inpPermadeath"> 真实江湖（永久死亡）
        </label>
        <button onclick="App.startNewGame()">踏入江湖</button>
      </div>

      <!-- 加载存档 -->
      <div id="loadForm" style="display:none;">
        <label for="savesList">选择存档</label>
        <div class="saves-list" id="savesList"></div>
        <button onclick="App.loadGame()">继续江湖</button>
        <button onclick="App.deleteSave()"
                class="btn-delete-save">
          删除存档
        </button>
        <button onclick="App.showLoginForm()"
                style="background:transparent;color:var(--text-muted);margin-top:4px;">
          返回新建
        </button>
      </div>

      <div style="text-align:center;margin-top:12px;">
        <button onclick="App.showLoadForm()"
                style="background:transparent;color:var(--accent-blue);">
          载入旧档 →
        </button>
        <span style="margin:0 8px;color:var(--border-silver);">|</span>
        <button onclick="App.toggleConfigPanel()"
                style="background:transparent;color:var(--accent-purple);">
          ⚙ 配置
        </button>
        <span style="margin:0 8px;color:var(--border-silver);">|</span>
        <button onclick="window.location.href='tests.html'"
                style="background:transparent;color:#e94560;">
          🧪 测试
        </button>
        <span style="margin:0 8px;color:var(--border-silver);">|</span>
        <button onclick="App.shutdownAll()"
                style="background:transparent;color:#ef4444;"
                title="关闭前后端服务">
          ⏻ 关闭服务
        </button>
      </div>
    </div>
  </div>

  <!-- ========== 游戏主界面 ========== -->

  <!-- 顶栏 -->
  <div class="topbar" id="topbar" style="display:none;">
    <h1>🏮 活纸 · 江湖行纪</h1>
    <span class="subtitle" id="topbarInfo"></span>
    <span class="spacer"></span>
    <button onclick="App.toggleConfigPanel()">⚙</button>
    <button onclick="App.doRest()">🛌 休息</button>
    <button onclick="App.doWait()">⏳ 等待</button>
    <button onclick="App.doSaveFlow()">💾 存档</button>
    <button onclick="App.doFinale()">📜 终局</button>
    <button onclick="App.doLogout()">🚪 退出</button>
  </div>

  <div class="main" id="mainUI" style="display:none;">

    <!-- ========== 左栏：大地图 ========== -->
    <div class="map-panel">
      <div class="panel-title" id="mapTitle">🗺️ 地图</div>
      <div class="map-container" id="mapContainer"></div>
      <div id="loadingOverlay" class="loading-overlay" style="display:none;" role="status" aria-label="加载中">
        <div class="loading-spinner"></div>
        <span class="loading-text">加载中...</span>
      </div>
      <div class="map-legend">
        <span style="color:#4fc3f7;">●</span> 你
        <span style="color:#ff7043;">●</span> NPC
        <span style="color:var(--text-muted);">WASD/方向键 移动 | 点击地图/小地图 寻路</span>
      </div>
    </div>

    <!-- ========== 右栏：状态 + NPC + 对话 ========== -->
    <div class="side-panel">

      <!-- 状态区（紧凑） -->
      <div class="stat-section">
        <h3>🧭 时辰 · 气象</h3>
        <div class="stat-grid">
          <div class="stat-item"><span class="label">时辰</span><span class="value" id="statTime">--</span></div>
          <div class="stat-item"><span class="label">天气</span><span class="value" id="statWeather">--</span></div>
          <div class="stat-item"><span class="label">第</span><span class="value" id="statDay">1</span><span class="label">日</span></div>
          <div class="stat-item"><span class="label">制钱</span><span class="value" id="statCoins">--</span><span class="label">文</span></div>
        </div>
        <div class="stat-bars">
          <div class="stat-bar-row">
            <span class="label">体力</span>
            <div class="bar-bg"><div class="bar-fill vigor" id="barVigor" style="width:100%;"></div></div>
            <span class="val" id="statVigor">--/--</span>
          </div>
          <div class="stat-bar-row">
            <span class="label">心气</span>
            <div class="bar-bg"><div class="bar-fill spirit" id="barSpirit" style="width:100%;"></div></div>
            <span class="val" id="statSpirit">--/--</span>
          </div>
        </div>
        <div class="inv-row" id="statInv">
          <span style="color:#555;">身无长物</span>
        </div>
        <div id="statAtmosphere" class="stat-atmosphere"></div>
        <div id="statDanger" class="stat-danger"></div>
      </div>

      <!-- NPC 列表 + 界门 -->
      <div class="npc-section">
        <h3>🧑🤝🧑 此地图人物</h3>
        <ul class="npc-list" id="npcList"></ul>
        <div class="portal-list" id="portalList"></div>
      </div>

      <!-- 悬赏榜 -->
      <div class="bounty-section">
        <h3>📜 悬赏榜</h3>
        <div id="bountyList"></div>
        <div class="bounty-actions">
          <button id="bountyRefreshBtn">刷新悬赏</button>
          <button id="bountyCompleteBtn">完成悬赏</button>
          <button id="bountyAbandonBtn">放弃悬赏</button>
        </div>
      </div>

      <!-- 对话框 -->
      <div class="dialogue-section">
        <div class="dialogue-area" id="dialogueArea" role="log" aria-live="polite">
          <div class="msg system" id="introMsg"></div>
        </div>
        <div class="input-bar">
          <select id="npcSelect"></select>
          <input type="text" id="msgInput" placeholder="对 TA 说些什么..."
                 onkeydown="if(event.key==='Enter')App.doTalk()">
          <button onclick="App.doTalk()" id="talkBtn">发送</button>
          <button id="cancelStreamBtn" onclick="App.cancelTalkStream()">取消</button>
        </div>
      </div>

    </div>

  </div>
</div>

<!-- ========== 确认对话框 ========== -->
<div class="confirm-overlay" id="confirmOverlay">
  <div class="confirm-dialog" id="confirmDialog" role="dialog" aria-modal="true">
    <div class="confirm-icon">⚠️</div>
    <h3 id="confirmTitle">确认操作</h3>
    <p id="confirmMessage">确定要执行此操作吗？</p>
    <div class="confirm-actions">
      <button class="btn-confirm btn-confirm-cancel" id="confirmCancel">取消</button>
      <button class="btn-confirm btn-confirm-ok" id="confirmOk">确定</button>
    </div>
  </div>
</div>

<!-- ========== API 配置面板 ========== -->
<div class="config-overlay" id="configOverlay">
  <div class="config-panel" id="configPanel" style="display:none;">
    <h3>⚙ API 配置</h3>

    <div class="cfg-group">
      <label>后端 API 地址</label>
      <input type="text" id="cfgBackendUrl" placeholder="http://localhost:8765">
    </div>

    <div class="cfg-group">
      <label>关闭服务密钥</label>
      <input type="password" id="cfgShutdownSecret" placeholder="与 .env 中 SHUTDOWN_SECRET 一致">
    </div>

    <div class="test-section">
      <h4>🔌 连接测试</h4>
      <div class="test-btn-row">
        <button class="test-btn" onclick="App.testBackendConnection()">测试后端</button>
      </div>
      <div id="backendTestResult" class="test-result" style="display:block;"></div>
    </div>

    <div class="cfg-actions">
      <button class="btn-primary" onclick="App.applyConfig()">保存配置</button>
      <button class="btn-secondary" onclick="App.toggleConfigPanel()">取消</button>
      <button class="btn-secondary" onclick="App.openAdminPanel()" style="color:var(--accent-blue);">🔧 运维面板</button>
    </div>
  </div>
</div>

<!-- 脚本（defer: 按顺序执行，不阻塞渲染） -->
<script src="js/store.js" defer></script>
<script src="js/html-utils.js" defer></script>
<script src="js/api.js" defer></script>
<script src="js/ui.js" defer></script>
<script src="js/map.js" defer></script>
<script src="js/dialogue.js" defer></script>
<script src="js/main.js" defer></script>

</body>
</html>
